# Не даёт бекенду на Render уснуть.
#
# Бесплатный инстанс засыпает после 15 минут без запросов, и первый посетитель
# ждёт около 30-50 секунд, пока контейнер поднимается: на сайте в это время висит
# «мониторинг подключается». Пинг раз в 10 минут держит его проснувшимся.
#
# Пингуем /api/health, а не /api/server/status: тот отвечает ошибкой, когда
# лежит игровой сервер, и будильник краснел бы, хотя бек при этом жив.
#
# Часов хватает: на бесплатном тарифе 750 часов в месяц на всё рабочее
# пространство, а один сервис без сна тратит максимум 744 (31 день × 24).
# Если на том же аккаунте Render появится второй бесплатный сервис, часы
# станут общими, и под конец месяца оба уснут до следующего.
#
# Расписание GitHub — «по возможности»: под нагрузкой запуск опаздывает на
# несколько минут, так что изредка бек всё же может успеть заснуть. Если это
# станет заметно, надёжнее внешний пингер вроде UptimeRobot или платный тариф.
#
# Раньше здесь был опрос сервера по A2S с записью в ветку data. Он удалён:
# A2S у этого сервера отдаёт выдуманные ники, а список теперь берётся из RCON.

name: Будильник для бекенда

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Разбудить Render
        run: |
          # Спящий инстанс поднимается до минуты, поэтому ждём с запасом
          curl --fail --silent --show-error --max-time 120 --retry 2 --retry-delay 10 \
            -o /dev/null -w "HTTP %{http_code} за %{time_total} с\n" \
            https://rustics-api.onrender.com/api/health
